<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Game</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="favicon.png" />

    <script src="/cardmeister/elements.cardmeister.min.js"></script>
    <script src="script.js" type="module" defer></script>
  </head>
  <body>
    <main class="user-container">
      <h1>User <span id="username"></span></h1>

      <button class="button" id="back-button" tabindex="1">Go back</button>

      <h2>Stats</h2>

      <table id="user-info" class="table">
        <tbody></tbody>
      </table>

      <h2>Games</h2>
      <table id="user-games" class="table games-table">
        <thead>
          <tr>
            <th>Started</th>
            <th>Rounds</th>
            <th>Participants</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <footer>
      <p>
        <small>&copy; Olai 2026.</small>
      </p>
    </footer>
  </body>
</html>
