<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poker Game</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="favicon.png" />

    <script src="/cardmeister/elements.cardmeister.min.js"></script>
    <script src="script.js" type="module" defer></script>
  </head>
  <body>
    <main class="user-container">
      <h1>Game summary</h1>

      <button class="button" id="back-button" tabindex="1">Go back</button>

      <h2>Stats</h2>

      <table id="game-info" class="table">
        <tbody></tbody>
      </table>

      <h2>Players</h2>
      <table id="game-players" class="table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Invested</th>
            <th>Profit</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <h2>Rounds</h2>
      <table id="game-rounds" class="table">
        <thead>
          <tr>
            <th>No.</th>
            <th>Winner</th>
            <th>Amount won</th>
            <th>Community cards</th>
            <th>Hand</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <footer>
      <p>
        <small>&copy; Olai 2026.</small>
      </p>
    </footer>
  </body>
</html>
